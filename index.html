<style>
:root{
  --paper:#FAF4E6;
  --snow:#EEF3F8;
  --ink:#3A2A1E;
  --ink-soft:#7A6656;
  --wood:#8A5A34;
  --wood-dark:#5E3B20;
  --forest:#3F6B47;
  --berry:#D9482F;
  --winter:#5A6FC0;
  --stamp:#D23B2A;
  --line:#E4D6BF;
  --card:#FFFDF8;
  --display:'Jua', 'Gowun Dodum', system-ui, sans-serif;
  --body:'Gowun Dodum', system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:var(--body);color:var(--ink);
  background:linear-gradient(180deg,#FBF1E3 0%,#FAF4E9 45%,#EAF0F7 100%);
  min-height:100vh;overflow-x:hidden;
}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px}
:focus-visible{outline:3px solid var(--winter);outline-offset:2px}
#snow{position:fixed;inset:0;pointer-events:none;z-index:0}

/* ---------- 상단 바 ---------- */
.topbar{
  position:relative;z-index:5;display:flex;align-items:center;gap:20px;
  padding:14px 32px;border-bottom:2px dashed var(--line);background:rgba(255,253,248,.7);
}
.brand{font-family:var(--display);font-size:22px;color:var(--wood-dark);white-space:nowrap}
.nav{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.nav button{
  border:0;background:transparent;padding:8px 14px;border-radius:999px;
  font-family:var(--display);font-size:18px;color:var(--ink-soft);
}
.nav button[aria-current="true"]{background:var(--wood);color:#fff}
.nav button:hover:not([aria-current="true"]){background:#F1E5D2}
.tools{display:flex;gap:8px}
.tool{
  border:2px solid var(--line);background:var(--card);border-radius:10px;
  padding:7px 12px;font-size:15px;color:var(--ink-soft);
}
.tool.on{border-color:var(--forest);color:var(--forest);background:#EEF5EF}
.tvbar{position:absolute;left:0;bottom:-2px;height:3px;background:var(--forest);width:0}

.demo-banner{
  position:relative;z-index:5;background:#FFF3C4;color:#6B5200;text-align:center;
  font-size:14px;padding:6px 12px;
}

main{position:relative;z-index:1;padding:28px 40px 40px;max-width:1700px;margin:0 auto}

/* ---------- 전체 화면 ---------- */
.hero{text-align:center;margin:8px 0 26px}
.hero .t1{font-family:var(--display);font-size:clamp(28px,3vw,46px);color:var(--ink);line-height:1.1}
.hero .t2{font-family:var(--display);font-size:clamp(48px,5.6vw,92px);line-height:1.05;margin-top:4px}
.hero .t2 .a{color:var(--berry)} .hero .t2 .b{color:var(--winter)}
.hero .period{margin-top:12px;font-size:20px;color:var(--ink-soft)}
.hero .period b{font-family:var(--display);font-weight:normal;color:var(--forest);margin-left:10px}

.school{
  max-width:980px;margin:0 auto 34px;display:flex;align-items:center;gap:18px;
  font-family:var(--display);font-size:20px;color:var(--wood-dark);
}
.school .track{flex:1;height:22px;background:#fff;border:2px solid var(--line);border-radius:999px;overflow:hidden}
.school .fill{height:100%;background:repeating-linear-gradient(135deg,#7FA3D6 0 12px,#8FB0DE 12px 24px);border-radius:999px;transition:width .8s ease}
.school .pct{min-width:70px;text-align:right}

.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.gcard{
  display:grid;grid-template-columns:116px 1fr;gap:18px;align-items:center;text-align:left;
  background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px 20px;
  color:inherit;
}
.gcard:hover{border-color:var(--wood)}
.avatar{width:116px;height:116px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 0 0 3px var(--accent,var(--wood))}
.gcard h3{margin:0 0 8px;font-family:var(--display);font-weight:normal;font-size:24px;color:var(--accent)}
.mini{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-bottom:10px}
.mini i{aspect-ratio:1;border-radius:4px;background:#ECE4D6}
.mini i.on{background:var(--accent)}
.mini i.part{background:linear-gradient(0deg,var(--accent) var(--p),#ECE4D6 var(--p))}
.gcard .nums{display:flex;justify-content:space-between;align-items:baseline;font-size:16px;color:var(--ink-soft)}
.gcard .nums b{font-family:var(--display);font-weight:normal;font-size:26px;color:var(--ink)}
.done-tag{display:inline-block;margin-left:6px;font-size:14px;background:var(--forest);color:#fff;border-radius:999px;padding:2px 10px;vertical-align:middle}

/* ---------- 학년 화면 ---------- */
.ghead{display:grid;grid-template-columns:auto 1fr auto;gap:28px;align-items:center;margin-bottom:22px}
.ghead .avatar{width:170px;height:170px;border-width:6px;box-shadow:0 0 0 4px var(--accent)}
.ghead h2{margin:0;font-family:var(--display);font-weight:normal;font-size:clamp(40px,4.2vw,68px);color:var(--accent);line-height:1.05}
.ghead .sub{margin-top:8px;font-size:21px;color:var(--ink-soft)}
.bigstat{text-align:right}
.bigstat .now{font-family:var(--display);font-size:clamp(48px,5vw,84px);line-height:1;color:var(--ink)}
.bigstat .now small{font-size:.42em;color:var(--ink-soft);margin-left:6px}
.bigstat .goal{font-size:20px;color:var(--ink-soft);margin-top:6px}
.bigstat .next{display:inline-block;margin-top:10px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 16px;font-size:18px}
.bigstat .next b{color:var(--accent)}

.board{position:relative;container-type:inline-size;border-radius:10px;overflow:hidden;box-shadow:0 0 0 10px #A9774B,0 0 0 13px #6E4526;margin:14px 13px 34px}
.board img{display:block;width:100%;height:auto}
.cell{position:absolute}
.frost{
  position:absolute;left:3%;right:3%;top:3%;
  background:rgba(238,244,250,.78);
  -webkit-backdrop-filter:grayscale(1);backdrop-filter:grayscale(1);
  border-radius:6px;
}
.frost.partial{border-bottom:3px solid #fff;border-radius:6px 6px 0 0}
.flake{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:2.2cqw;opacity:.55;color:#8EA8C8}
.stamp{
  position:absolute;right:4%;top:5%;width:3.1cqw;height:3.1cqw;border-radius:50%;
  border:.28cqw solid var(--stamp);color:var(--stamp);
  display:grid;place-items:center;font-family:var(--display);font-size:1cqw;line-height:1;
  transform:rotate(-14deg);background:rgba(255,255,255,.55);
}
.cell.thaw .stamp{animation:stampIn .7s cubic-bezier(.3,1.6,.5,1) both}
.cell.thaw{animation:glow 1.6s ease-out}
@keyframes stampIn{from{transform:rotate(-14deg) scale(2.6);opacity:0}to{transform:rotate(-14deg) scale(1);opacity:1}}
@keyframes glow{0%{box-shadow:inset 0 0 0 0 rgba(255,214,102,0)}30%{box-shadow:inset 0 0 0 .6cqw rgba(255,214,102,.9)}100%{box-shadow:inset 0 0 0 0 rgba(255,214,102,0)}}
.complete-ribbon{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-4deg);
  background:var(--forest);color:#fff;font-family:var(--display);font-size:5cqw;
  padding:1.2cqw 4cqw;border-radius:1.4cqw;border:.5cqw solid #fff;box-shadow:0 1cqw 3cqw rgba(0,0,0,.25);
  white-space:nowrap;
}

.leaders{display:grid;grid-template-columns:auto repeat(3,1fr);gap:16px;align-items:stretch}
.leaders .lt{
  font-family:var(--display);font-size:24px;color:var(--wood-dark);display:flex;align-items:center;
  padding-right:8px;line-height:1.2;
}
.leader{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 18px;display:flex;align-items:center;gap:14px}
.leader .badge{font-size:40px;line-height:1;position:relative}
.leader .badge span{
  position:absolute;right:-6px;bottom:-6px;background:var(--wood);color:#fff;font-family:var(--display);
  font-size:15px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:2px solid #fff;
}
.leader .nm{font-family:var(--display);font-size:28px}
.leader .pg{font-size:17px;color:var(--ink-soft)}
.leader.empty{justify-content:center;color:#B8A894;font-size:17px;border-style:dashed}

/* ---------- 관리 화면 ---------- */
.admin{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:24px 40px 60px}
.atabs{display:flex;gap:6px;margin-bottom:22px;border-bottom:2px solid var(--line)}
.atabs button{border:0;background:none;padding:12px 18px;font-size:17px;color:var(--ink-soft);border-bottom:3px solid transparent;margin-bottom:-2px}
.atabs button[aria-selected="true"]{color:var(--wood-dark);border-bottom-color:var(--wood);font-weight:bold}
.atabs .sp{flex:1}
.panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:24px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lbl{font-size:14px;color:var(--ink-soft);margin:18px 0 8px;font-weight:bold}
.lbl:first-child{margin-top:0}
.chip{
  border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 14px;font-size:16px;color:var(--ink);
}
.chip[aria-pressed="true"]{border-color:var(--wood);background:var(--wood);color:#fff}
.chip.gr{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px}
.chip.gr img{width:34px;height:34px;border-radius:50%;object-fit:cover}
.field{border:2px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink)}
.field:focus{border-color:var(--winter);outline:none}
.btn{border:0;border-radius:12px;padding:11px 20px;font-size:16px;background:var(--wood);color:#fff}
.btn.big{padding:14px 30px;font-size:18px;font-family:var(--display)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn.danger{background:#fff;color:var(--berry);border:2px solid #F0C6BC}
.btn:disabled{opacity:.45;cursor:not-allowed}
.grid2{display:grid;grid-template-columns:1.7fr 1fr;gap:22px;align-items:start}
.results{display:flex;flex-direction:column;gap:8px;margin-top:10px;max-height:330px;overflow:auto}
.res{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px}
.res:hover{border-color:var(--winter)}
.res img{width:44px;height:60px;object-fit:cover;border-radius:4px;background:#eee}
.res .t{font-weight:bold;font-size:15px}
.res .m{font-size:13px;color:var(--ink-soft)}
.res .p{font-family:var(--display);font-size:18px;color:var(--winter);white-space:nowrap}
.calc{margin-top:18px;padding:16px 18px;border-radius:14px;background:#F4EFE4;display:flex;justify-content:space-between;align-items:center;gap:12px}
.calc .v{font-family:var(--display);font-size:32px;color:var(--forest)}
.calc .f{font-size:14px;color:var(--ink-soft)}
.note{font-size:13px;color:var(--ink-soft);margin-top:6px}
.warn{background:#FFF3C4;border-radius:10px;padding:10px 14px;font-size:14px;color:#6B5200;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;color:var(--ink-soft);font-weight:bold;font-size:13px;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #EFE6D6;vertical-align:middle}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:hover td{background:#FCF8F0}
.tbl-wrap{overflow-x:auto}
.mini-btn{border:0;background:none;color:var(--winter);font-size:14px;padding:4px 6px}
.mini-btn.del{color:var(--berry)}
.cat{display:inline-block;font-size:12px;border-radius:999px;padding:2px 8px;background:#EEE6D6}
.cat.lit{background:#E3EEE5;color:var(--forest)}
.cat.story40{background:#E7EAF7;color:var(--winter)}
.recent{display:flex;flex-direction:column;gap:6px}
.recent .it{display:flex;justify-content:space-between;gap:10px;font-size:14px;border-bottom:1px dashed var(--line);padding:6px 0}
.recent .it b{color:var(--forest)}
.stuGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.stuGrid .panel{padding:18px}
.stuGrid h4{margin:0 0 10px;font-family:var(--display);font-weight:normal;font-size:20px;color:var(--accent)}
.set-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.set-grid textarea{width:100%;min-height:150px;resize:vertical}
.toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:50;
  background:var(--ink);color:#fff;padding:12px 22px;border-radius:999px;font-size:16px;transition:.25s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.modal-bg{position:fixed;inset:0;background:rgba(58,42,30,.4);display:grid;place-items:center;z-index:40}
.modal{background:var(--card);border-radius:20px;padding:26px;width:min(460px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h3{margin:0 0 14px;font-family:var(--display);font-weight:normal;font-size:24px}
.modal .field{width:100%}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.err{color:var(--berry);font-size:14px;margin-top:8px;min-height:1em}

@media (max-width:1100px){
  .cards{grid-template-columns:repeat(2,1fr)}
  .grid2,.stuGrid,.set-grid{grid-template-columns:1fr}
  .leaders{grid-template-columns:1fr}
  .ghead{grid-template-columns:auto 1fr}
  .bigstat{grid-column:1/-1;text-align:left}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<div id="demoBanner" class="demo-banner" hidden>체험 모드예요. 기록이 이 브라우저에만 저장돼요. 파일 위쪽 FIREBASE_CONFIG를 채우면 모든 기기에서 함께 보여요.</div>
<header class="topbar">
  <div class="brand">❄ 소요초의 특별한 겨울맞이</div>
  <nav class="nav" id="nav"></nav>
  <div class="tools">
    <button class="tool" id="tvBtn" title="전체와 학년 화면을 차례로 보여줘요">자동 넘김</button>
    <button class="tool" id="fsBtn">전체 화면</button>
    <button class="tool" id="adminBtn">관리</button>
  </div>
  <div class="tvbar" id="tvbar"></div>
</header>
<div id="app"></div>
<div class="toast" id="toast" role="status"></div>
<div id="modalRoot"></div>

  goals:{1:2500,2:6000,3:7000,4:2500,5:11000,6:16000},

/* ============================================================
   저장소: Firebase 또는 체험 모드(localStorage)
   ============================================================ */
const DEMO = !FIREBASE_CONFIG.apiKey;
const Store = (()=>{
  let onCfg=()=>{}, onRec=()=>{};
  if(!DEMO){
    firebase.initializeApp(FIREBASE_CONFIG);
    const db = firebase.firestore();
    const cfgRef = db.collection(COLL_CONFIG).doc("main");
    const recCol = db.collection(COLL_RECORDS);
    return {
      init(a,b){
        onCfg=a; onRec=b;
        cfgRef.onSnapshot(s=>onCfg(s.exists?s.data():null), e=>showErr(e));
        recCol.onSnapshot(s=>onRec(s.docs.map(d=>({id:d.id,...d.data()}))), e=>showErr(e));
      },
      saveConfig:patch=>cfgRef.set(patch,{merge:true}),
      add:r=>recCol.add(r),
      update:(id,p)=>recCol.doc(id).update(p),
      remove:id=>recCol.doc(id).delete()
    };
  }
  const K1="marathon_demo_config", K2="marathon_demo_records";
  const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
  const write=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
  const emit=()=>{onCfg(read(K1,null)); onRec(read(K2,[]));};
  window.addEventListener("storage",emit);
  return {
    init(a,b){onCfg=a;onRec=b;emit();},
    async saveConfig(p){write(K1,{...read(K1,{}),...p});emit();},
    async add(r){const l=read(K2,[]);l.push({id:"d"+Date.now()+Math.random().toString(36).slice(2,6),...r});write(K2,l);emit();},
    async update(id,p){write(K2,read(K2,[]).map(x=>x.id===id?{...x,...p}:x));emit();},
    async remove(id){write(K2,read(K2,[]).filter(x=>x.id!==id));emit();}
  };
})();
function showErr(e){console.error(e);toast("저장소에 연결하지 못했어요. Firebase 설정과 보안 규칙을 확인해 주세요.")}

  cfg:structuredClone(DEFAULT_CONFIG),
  records:[],
  route:"all",
  admin:sessionStorage.getItem("marathon_admin")==="1",
  atab:"record",
  form:{grade:1,student:"",title:"",pages:"",cat:"lit",isbn:"",results:[],searching:false,searchMsg:""},
  listGrade:"all", listQ:"",
  prevFilled:{}, loaded:false,
  tv:false, tvTimer:null
};

const $ = s=>document.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n=>Number(n||0).toLocaleString("ko-KR");
const norm = s=>String(s||"").replace(/\s+/g,"").toLowerCase();

function mergeCfg(c){
  const d=structuredClone(DEFAULT_CONFIG);
  if(!c) return d;
  return {...d,...c,goals:{...d.goals,...(c.goals||{})},students:{...d.students,...(c.students||{})}};
}

function gradeStats(g){
  const recs=S.records.filter(r=>+r.grade===+g);
  const total=recs.reduce((a,r)=>a+(+r.credited||0),0);
  const goal=+S.cfg.goals[g]||1;
  const per={};
  (S.cfg.students[g]||[]).forEach(n=>per[n]={name:n,pages:0,books:0});
  recs.forEach(r=>{const p=per[r.student]||(per[r.student]={name:r.student,pages:0,books:0});p.pages+=+r.credited||0;p.books++;});
  const ratio=Math.min(total/goal,1);
  const exact=Math.min(total/goal*CELLS,CELLS);
  const filled=Math.floor(exact+1e-9);
  return {recs,total,goal,per,ratio,pct:Math.floor(ratio*100),filled,partial:filled<CELLS?exact-filled:0,cellSize:goal/CELLS};
}
function ranking(per){
  const arr=Object.values(per).filter(p=>p.pages>0).sort((a,b)=>b.pages-a.pages||a.name.localeCompare(b.name,"ko"));
  let rank=0,last=null;
  arr.forEach((p,i)=>{if(p.pages!==last){rank=i+1;last=p.pages}p.rank=rank;});
  return arr;
}

function dday(){
  const end=new Date(S.cfg.end+"T23:59:59"), start=new Date(S.cfg.start+"T00:00:00"), now=new Date();
  if(now<start) return `시작까지 ${Math.ceil((start-now)/864e5)}일`;
  if(now>end) return "겨울맞이가 끝났어요";
  const d=Math.floor((end-now)/864e5);
  return d===0?"오늘이 마지막 날!":`마감까지 ${d}일`;
}
function dateKo(s){const d=new Date(s+"T00:00:00");return `${d.getMonth()+1}월 ${d.getDate()}일(${"일월화수목금토"[d.getDay()]})`}

function renderAll(){
  let sum=0,goal=0;
  const cards=[1,2,3,4,5,6].map(g=>{
    const st=gradeStats(g),G=GRADES[g];sum+=st.total;goal+=st.goal;
    const mini=Array.from({length:CELLS},(_,i)=>i<st.filled?'<i class="on"></i>':(i===st.filled&&st.partial>0?`<i class="part" style="--p:${Math.round(st.partial*100)}%"></i>`:"<i></i>")).join("");
    return `<button class="gcard" data-go="g${g}" style="--accent:${G.accent}">
      <img class="avatar" src="${IMG["c"+g]}" alt="">

  }).join("");

  return `<section class="hero">
      <div class="t1">소요초의</div>
      <div class="t2"><span class="a">특별한</span> <span class="b">겨울맞이</span></div>
      <div class="period">${dateKo(S.cfg.start)} ~ ${dateKo(S.cfg.end)}<b>${dday()}</b></div>
    </section>
    <div class="school"><span>소요초 모두의 겨울 준비</span><div class="track"><div class="fill" style="width:${(sp*100).toFixed(1)}%"></div></div><span class="pct">${Math.floor(sp*100)}%</span></div>

function renderGrade(g){
  const st=gradeStats(g),G=GRADES[g];
  const prev=S.prevFilled[g];
  const cells=Array.from({length:CELLS},(_,i)=>{
    const c=i%COLS,r=Math.floor(i/COLS);
    const pos=`left:${c*10}%;top:${r*50}%;width:10%;height:50%`;
    if(i<st.filled){
      const thaw=S.loaded&&prev!==undefined&&i>=prev?" thaw":"";
      return `<div class="cell${thaw}" style="${pos}"><div class="stamp">확인</div></div>`;
    }
    if(i===st.filled&&st.partial>0){
      const h=94*(1-st.partial);
      return `<div class="cell" style="${pos}"><div class="frost partial" style="height:${h}%"></div></div>`;
    }
    return `<div class="cell" style="${pos}"><div class="frost" style="height:94%"><span class="flake">❄</span></div></div>`;
  }).join("");
  S.prevFilled[g]=st.filled;

  const next=st.ratio>=1?`<div class="next">겨울 준비 완성!</div>`
    :`<div class="next">다음 ${G.item}까지 <b>${fmt(Math.ceil((st.filled+1)*st.cellSize-st.total))}쪽</b></div>`;
  const rk=ranking(st.per).filter(p=>p.rank<=3).slice(0,5);
  const lead=rk.length?rk.map(p=>`<div class="leader"><div class="badge">${G.emoji}<span>${p.rank}</span></div><div><div class="nm">${esc(p.name)}</div><div class="pg">${fmt(p.pages)}쪽 · ${p.books}권</div></div></div>`).join("")
    :"";
  const blanks=Math.max(0,3-rk.length);
  return `<section style="--accent:${G.accent}">
    <div class="ghead">
      <img class="avatar" src="${IMG["c"+g]}" alt="">
      <div><h2>${G.title}</h2><div class="sub">${G.sub}</div></div>
      <div class="bigstat">
        <div class="now">${fmt(st.total)}<small>쪽</small></div>
        <div class="goal">목표 ${fmt(st.goal)}쪽 · ${G.item} ${st.filled}개 ${G.verb} (${st.pct}%)</div>
        ${next}
      </div>
    </div>
    <div class="board"><img src="${IMG["g"+g]}" alt="${G.item} 20칸 판">${cells}${st.ratio>=1?'<div class="complete-ribbon">겨울 준비 완성!</div>':""}</div>
    <div class="leaders"><div class="lt">겨울 준비<br>으뜸 일꾼</div>${lead}${'<div class="leader empty">책을 읽고 이름을 올려요</div>'.repeat(blanks)}</div>
  </section>`;
}

function captureFocus(){const a=document.activeElement;if(!a||!a.id)return null;return {id:a.id,s:a.selectionStart,e:a.selectionEnd}}
function restoreFocus(k){if(!k)return;const el=document.getElementById(k.id);if(!el)return;el.focus();try{if(k.s!=null)el.setSelectionRange(k.s,k.e)}catch(e){}}

function go(r){
  if(r!=="admin") stopTV();
  S.route=r; location.hash=r==="all"?"":r; render();
}

   이벤트
   ============================================================ */
document.addEventListener("click",async e=>{
  const t=e.target.closest("button");if(!t)return;
  const d=t.dataset;
  if(d.go){go(d.go);return;}
  if(d.atab){S.atab=d.atab;render();return;}
  if(d.fgrade){S.form.grade=+d.fgrade;S.form.student="";render();return;}
  if(d.fstu!==undefined){S.form.student=d.fstu;render();return;}
  if(d.fcat){S.form.cat=d.fcat;render();return;}
  if(d.pick!==undefined){
    const b=S.form.results[+d.pick];S.form.title=b.title;if(b.pages)S.form.pages=String(b.pages);S.form.isbn=b.isbn||"";
    S.form.results=[];S.form.searchMsg=b.pages?"":"알라딘에 쪽수 정보가 없어요. 직접 입력해 주세요.";render();return;
  }
  if(d.edit){openEdit(d.edit);return;}
  if(d.del){
    const r=S.records.find(x=>x.id===d.del);
    if(r&&confirm(`${r.student} · ${r.title} 기록을 삭제할까요?`)){await Store.remove(d.del);toast("삭제했어요");}
    return;
  }
  switch(d.act){
    case "search": return doSearch();
    case "save": return doSave();
    case "saveSettings": return saveSettings();
    case "logout": S.admin=false;sessionStorage.removeItem("marathon_admin");go("all");return;
  }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="fTitle"){S.form.title=t.value;refreshSaveState();}
  if(t.id==="fPages"){S.form.pages=t.value;$("#calcV").textContent=fmt(creditedOf(S.form))+"쪽";refreshSaveState();}
  if(t.id==="lQ"){S.listQ=t.value;render();}
});
document.addEventListener("change",e=>{if(e.target.id==="lGrade"){S.listGrade=e.target.value;render();}});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.id==="fTitle"){e.preventDefault();doSearch();}
  if(e.key==="Enter"&&e.target.id==="fPages"){e.preventDefault();doSave();}
});
function refreshSaveState(){
  const f=S.form,btn=document.querySelector('[data-act="save"]');
  if(btn)btn.disabled=!(f.student&&f.title.trim()&&(f.cat==="story40"||+f.pages>0));
}

$("#adminBtn").onclick=()=>go("admin");
$("#tvBtn").onclick=()=>S.tv?stopTV():startTV();
$("#fsBtn").onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.()};
window.addEventListener("hashchange",()=>{const r=location.hash.slice(1)||"all";if(r!==S.route){S.route=r;render();}});

/* ---------- 알라딘 ---------- */
async function doSearch(){
  const f=S.form,q=f.title.trim();
  if(!q){f.searchMsg="책 제목을 먼저 입력해 주세요.";render();return;}
  if(!S.cfg.aladinUrl){f.searchMsg="설정 탭에 알라딘 검색 주소를 넣으면 검색할 수 있어요. 지금은 쪽수를 직접 입력해 주세요.";render();return;}
  f.searching=true;f.searchMsg="";render();
  try{
    const res=await fetch(S.cfg.aladinUrl+(S.cfg.aladinUrl.includes("?")?"&":"?")+"q="+encodeURIComponent(q));
    const data=await res.json();
    if(data.error) throw new Error(data.error);
    f.results=data.items||[];
    if(!f.results.length) f.searchMsg="검색 결과가 없어요. 제목을 줄여서 다시 찾거나 직접 입력해 주세요.";
  }catch(err){
    console.error(err);f.results=[];f.searchMsg="알라딘 검색에 실패했어요. 설정의 검색 주소와 Apps Script 배포 상태를 확인해 주세요.";
  }
  f.searching=false;render();
}

/* ---------- 저장 ---------- */
async function doSave(){
  const f=S.form;
  if(!(f.student&&f.title.trim()&&(f.cat==="story40"||+f.pages>0)))return;
  const dup=S.records.some(r=>+r.grade===+f.grade&&r.student===f.student&&norm(r.title)===norm(f.title));
  if(dup&&!confirm(`${f.student} 학생은 「${f.title}」을(를) 이미 기록했어요. 그래도 저장할까요?`))return;
  const rec={grade:f.grade,student:f.student,title:f.title.trim(),pages:f.cat==="story40"?40:+f.pages,cat:f.cat,credited:creditedOf(f),isbn:f.isbn||"",ts:Date.now()};
  try{
    await Store.add(rec);
    toast(`${rec.student} +${fmt(rec.credited)}쪽 기록했어요`);
    S.form={...S.form,student:"",title:"",pages:"",isbn:"",results:[],searchMsg:"",cat:"lit"};
    render();
  }catch(e){showErr(e)}
}

/* ---------- 설정 ---------- */
function parseNames(txt){
  const out=[];
  txt.split(/[\n,\t]+/).map(s=>s.trim()).filter(s=>s&&!/^\d+(번)?$/.test(s)).forEach(s=>{if(!out.includes(s))out.push(s)});
  return out;
}
async function saveSettings(){
  const goals={},students={};
  document.querySelectorAll("[data-goal]").forEach(i=>goals[i.dataset.goal]=Math.max(1,+i.value||1));
  document.querySelectorAll("[data-stu]").forEach(t=>students[t.dataset.stu]=parseNames(t.value));
  const patch={goals,students,start:$("#sStart").value||DEFAULT_CONFIG.start,end:$("#sEnd").value||DEFAULT_CONFIG.end,
    tvSeconds:Math.max(5,+$("#sTv").value||15),aladinUrl:$("#sAladin").value.trim()};
  const np=$("#sPass").value;
  if(np) patch.passHash=await sha(np);
  try{await Store.saveConfig(patch);toast("설정을 저장했어요");}catch(e){showErr(e)}
}

/* ---------- 비밀번호 ---------- */
async function sha(s){
  if(crypto?.subtle){
    const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("soyo-winter:"+s));
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
  }
  let h=0;for(const c of "soyo-winter:"+s)h=(h*31+c.charCodeAt(0))|0;return "x"+h;
}
function openModal(html,onMount){
  $("#modalRoot").innerHTML=`<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  onMount&&onMount($("#modalRoot .modal"));
}
function closeModal(){$("#modalRoot").innerHTML=""}
function openLogin(){
  const first=!S.cfg.passHash;
  openModal(`<h3>${first?"관리 비밀번호 만들기":"관리 화면 열기"}</h3>
    <p class="note" style="margin:0 0 12px">${first?"처음 한 번 비밀번호를 정해 주세요. 이 비밀번호로 관리 화면에 들어와요.":"비밀번호를 입력해 주세요."}</p>
    <input class="field" type="password" id="pw" autocomplete="current-password" placeholder="비밀번호">
    ${first?'<input class="field" type="password" id="pw2" placeholder="한 번 더" style="margin-top:8px">':""}
    <div class="err" id="pwErr"></div>
    <div class="acts"><button class="btn ghost" id="pwCancel">취소</button><button class="btn" id="pwOk">${first?"만들기":"열기"}</button></div>`,m=>{
      const pw=m.querySelector("#pw");pw.focus();
      const ok=async()=>{
        const v=pw.value;if(!v){m.querySelector("#pwErr").textContent="비밀번호를 입력해 주세요.";return;}
        if(first){
          if(v!==m.querySelector("#pw2").value){m.querySelector("#pwErr").textContent="두 비밀번호가 달라요.";return;}
          await Store.saveConfig({passHash:await sha(v)});
        }else if(await sha(v)!==S.cfg.passHash){m.querySelector("#pwErr").textContent="비밀번호가 맞지 않아요.";return;}
        S.admin=true;sessionStorage.setItem("marathon_admin","1");closeModal();render();
      };
      m.querySelector("#pwOk").onclick=ok;
      m.addEventListener("keydown",e=>{if(e.key==="Enter")ok();if(e.key==="Escape")m.querySelector("#pwCancel").click();});
      m.querySelector("#pwCancel").onclick=()=>{closeModal();go("all");};
    });
}

/* ---------- 기록 수정 ---------- */
function openEdit(id){
  const r=S.records.find(x=>x.id===id);if(!r)return;
  const names=[...new Set([...(S.cfg.students[r.grade]||[]),r.student])];
  const cats=catsFor(r.grade);
  openModal(`<h3>기록 수정</h3>
    <div class="lbl">학생</div><select class="field" id="eStu">${names.map(n=>`<option ${n===r.student?"selected":""}>${esc(n)}</option>`).join("")}</select>
    <div class="lbl">책 제목</div><input class="field" id="eTitle" value="${esc(r.title)}">
    <div class="lbl">분류</div><select class="field" id="eCat">${cats.map(c=>`<option value="${c}" ${c===r.cat?"selected":""}>${CATS[c].label}</option>`).join("")}</select>
    <div class="lbl">책 쪽수</div><input class="field" id="ePages" type="number" min="1" value="${r.pages}">
    <div class="calc"><div><div class="f">인정 쪽수</div><div class="v" id="eCalc"></div></div></div>
    <div class="acts"><button class="btn ghost" id="eCancel">취소</button><button class="btn" id="eOk">수정 저장</button></div>`,m=>{
      const upd=()=>{const f={cat:m.querySelector("#eCat").value,pages:m.querySelector("#ePages").value};m.querySelector("#ePages").disabled=f.cat==="story40";m.querySelector("#eCalc").textContent=fmt(creditedOf(f))+"쪽";};
      m.querySelector("#eCat").onchange=upd;m.querySelector("#ePages").oninput=upd;upd();
      m.querySelector("#eCancel").onclick=closeModal;
      m.querySelector("#eOk").onclick=async()=>{
        const f={cat:m.querySelector("#eCat").value,pages:m.querySelector("#ePages").value};
        const patch={student:m.querySelector("#eStu").value,title:m.querySelector("#eTitle").value.trim(),cat:f.cat,pages:f.cat==="story40"?40:+f.pages||0,credited:creditedOf(f)};
        try{await Store.update(id,patch);closeModal();toast("수정했어요");}catch(e){showErr(e)}
      };
    });
}

/* ---------- 자동 넘김 ---------- */
const TV_ORDER=["all","g1","g2","g3","g4","g5","g6"];
function startTV(){
  S.tv=true;let i=Math.max(0,TV_ORDER.indexOf(S.route));
  const step=()=>{
    S.route=TV_ORDER[i%TV_ORDER.length];render();
    const bar=$("#tvbar");bar.style.transition="none";bar.style.width="0";
    requestAnimationFrame(()=>requestAnimationFrame(()=>{bar.style.transition=`width ${S.cfg.tvSeconds}s linear`;bar.style.width="100%";}));
    i++;
  };
  step();S.tvTimer=setInterval(step,S.cfg.tvSeconds*1000);renderNav();
}
function stopTV(){if(!S.tv)return;S.tv=false;clearInterval(S.tvTimer);const b=$("#tvbar");b.style.transition="none";b.style.width="0";renderNav();}

/* ---------- 알림 ---------- */
let toastT;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2600);}

/* ---------- 눈 ---------- */
(function snow(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=$("#snow"),x=c.getContext("2d");let W,H,f=[];
  const size=()=>{W=c.width=innerWidth;H=c.height=innerHeight;};size();addEventListener("resize",size);
  for(let i=0;i<46;i++)f.push({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*2.6,s:.25+Math.random()*.6,d:Math.random()*6});
  (function loop(t){
    x.clearRect(0,0,W,H);x.fillStyle="rgba(150,175,210,.45)";
    f.forEach(p=>{p.y+=p.s;p.x+=Math.sin(t/2400+p.d)*.3;if(p.y>H+5){p.y=-5;p.x=Math.random()*W;}x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill();});
    requestAnimationFrame(loop);
  })(0);
})();

/* ============================================================
   시작
   ============================================================ */
S.route=location.hash.slice(1)||"all";
Store.init(c=>{S.cfg=mergeCfg(c);render();},recs=>{
  S.records=recs;
  if(!S.loaded){[1,2,3,4,5,6].forEach(g=>S.prevFilled[g]=gradeStats(g).filled);}
  render();S.loaded=true;
});
setInterval(()=>{if(S.route==="all")render();},60*60*1000);
</script>
