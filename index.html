<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>훈민정음 언해본 빨리 읽기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ECE6D6; --paper-2:#E2DAC6; --ink:#24211C; --ink-soft:#7A7263;
  --seal:#B3322B; --indigo:#2D3E66; --line:#3A352C;
  --serif:"Noto Serif KR","Noto Serif CJK KR","Apple SD Gothic Neo","Malgun Gothic",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1E1C19; --paper-2:#29261F; --ink:#EAE3D1; --ink-soft:#A39B88;
    --seal:#D9544B; --indigo:#8FA6D9; --line:#CFC6B0;
  }
}
:root[data-theme="dark"]{
  --paper:#1E1C19; --paper-2:#29261F; --ink:#EAE3D1; --ink-soft:#A39B88;
  --seal:#D9544B; --indigo:#8FA6D9; --line:#CFC6B0;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--serif);-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font-family:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--seal);outline-offset:3px}
.hidden{display:none!important}

.app{height:100%;display:flex;flex-direction:column;max-width:1200px;margin:0 auto;padding:0 clamp(14px,3vw,36px)}

/* 위: 시간 */
.top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:clamp(8px,1.6vh,18px) 0;border-bottom:3px double var(--line)}
.top h1{margin:0;font-size:clamp(16px,2.4vh,22px);font-weight:600;letter-spacing:.06em;line-height:1.4}
.timer{font-size:clamp(44px,8.5vh,84px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.timer small{font-size:.38em;font-weight:600;margin-left:6px}

/* 가운데: 본문 8줄 (글자 크기는 화면에 맞게 자동 조절) */
.text{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:.18em;padding:.4em 0;font-size:30px}
.ln{flex:none;display:flex;align-items:center;gap:.4em;font-weight:600;line-height:1.3;padding:.08em .35em;border-radius:3px;color:var(--ink);transition:color .2s,background-color .2s}
.ln .no{flex:none;width:1.2em;font-size:.55em;font-weight:400;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.ln .tx{flex:1;min-width:0;white-space:nowrap}
.ln .mk{flex:none;width:1.25em;height:1.25em;display:grid;place-items:center}
.reading .ln{color:var(--ink-soft)}
.reading .ln.now{color:var(--ink);background:color-mix(in srgb,var(--seal) 10%,transparent);box-shadow:inset 5px 0 0 var(--seal)}
.reading .ln.done{color:var(--indigo)}
.stamp{width:100%;height:100%;border:3px solid var(--seal);border-radius:50%;color:var(--seal);font-size:.36em;font-weight:900;display:grid;place-items:center;transform:rotate(-10deg);animation:stamp .32s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{from{transform:scale(2.4) rotate(-30deg);opacity:0}to{transform:scale(1) rotate(-10deg);opacity:1}}
@media (prefers-reduced-motion: reduce){.stamp{animation:none}}

/* 아래: 상태와 버튼 */
.bottom{flex:none;display:flex;align-items:center;gap:14px;padding:clamp(8px,1.6vh,16px) 0;border-top:3px double var(--line)}
.mic{width:18px;height:18px;border-radius:50%;background:var(--ink-soft);flex:none}
.mic.on{background:var(--seal);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion: reduce){.mic.on{animation:none}}
.heard{flex:1;min-width:0;font-size:17px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl;text-align:left}
.heard bdi{direction:ltr}
.btn{font-size:17px;padding:10px 16px;border:2px solid var(--line);background:var(--paper-2);border-radius:4px;flex:none}
.go{font-size:clamp(24px,4vh,32px);font-weight:900;padding:12px 40px;border:none;background:var(--seal);color:#FFF8EE;border-radius:4px;letter-spacing:.12em}
.go:disabled{opacity:.4;cursor:not-allowed}
.warn{flex:1;font-size:16px;line-height:1.5;color:var(--seal)}
.spacer{flex:1}

/* 카운트다운 / 채점 / 결과 */
.overlay{position:fixed;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--paper) 92%,transparent);z-index:5;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px))}
.count{font-size:min(42vh,260px);font-weight:900;color:var(--seal);line-height:1}
.wait{font-size:28px;font-weight:600;color:var(--ink-soft)}
.result{width:min(900px,100%);max-height:100%;overflow-y:auto;background:var(--paper);border:3px double var(--line);padding:clamp(16px,3vh,28px) clamp(16px,3vw,32px);display:flex;flex-direction:column;gap:clamp(10px,2vh,18px)}
.score{display:flex;align-items:baseline;justify-content:center;gap:clamp(20px,5vw,56px);flex-wrap:wrap}
.score div{text-align:center}
.score .big{font-size:clamp(56px,12vh,110px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.score .big small{font-size:.34em;margin-left:6px}
.score .acc{color:var(--indigo)}
.score .lb{font-size:17px;color:var(--ink-soft);margin-top:6px}
.rows{margin:0;padding:0;list-style:none;border-top:1px solid color-mix(in srgb,var(--line) 40%,transparent)}
.rows li{display:grid;grid-template-columns:1.6em 1fr auto;gap:2px 10px;padding:8px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 40%,transparent);align-items:baseline}
.rows .n{color:var(--ink-soft);font-size:15px}
.rows .g{font-size:19px;font-weight:600}
.rows .p{font-size:19px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--indigo)}
.rows .h{grid-column:2 / 4;font-size:15px;color:var(--ink-soft)}
.rows li.low .p{color:var(--seal)}
.rows li.low .h{color:var(--seal)}
.result .go{align-self:center}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>훈민정음 언해본<br>빨리 읽기</h1>
    <div class="timer" id="timer">0.0<small>초</small></div>
  </header>

  <main class="text" id="text"></main>

  <!-- 시작 전 -->
  <footer class="bottom" id="ready">
    <div class="warn hidden" id="noSupport">음성 인식이 안 되는 브라우저예요. 안드로이드는 크롬, 아이패드는 사파리로 열어 주세요.</div>
    <div class="spacer"></div>
    <button class="go" id="startBtn">시작</button>
  </footer>

  <!-- 읽는 중 -->
  <footer class="bottom hidden" id="playing">
    <span class="mic" id="mic" aria-hidden="true"></span>
    <div class="heard" id="heard"><bdi>멈추지 말고 끝까지 읽어요</bdi></div>
    <button class="btn" id="endBtn">끝</button>
    <button class="btn" id="resetBtn">처음으로</button>
  </footer>
</div>

<div class="overlay hidden" id="countOv"><div class="count" id="countNum">3</div></div>
<div class="overlay hidden" id="waitOv"><div class="wait">채점하는 중…</div></div>

<div class="overlay hidden" id="endOv">
  <div class="result">
    <div class="score">
      <div><div class="big" id="rTime">0.0<small>초</small></div><div class="lb">기록</div></div>
      <div><div class="big acc" id="rAcc">0<small>%</small></div><div class="lb">정확도</div></div>
    </div>
    <ol class="rows" id="rRows"></ol>
    <button class="go" id="nextBtn">다음 사람</button>
  </div>
</div>

<script>
/* 본문: 아이들이 보는 줄(g) + 음성인식이 현대어로 바꿔 적을 때 허용할 표기(v) */
const LINES = [
  {g:"나랏말싸미 듕귁에 달아",
   v:["나랏말싸미 중국에 달아","나라말싸미 중국에 달아","나랏말쌈이 중국에 달아"]},
  {g:"문자와로 서르 사맛디 아니할쎄",
   v:["문자와로 서로 사맛디 아니할세","문자와로 서르 사맛디 아니할새","문자와로 서로 사마디 아니할세"]},
  {g:"이런 젼차로 어린 백셩이 니르고져 홀 배 이셔도",
   v:["이런 전차로 어린 백성이 니르고져 홀 배 이셔도","이런 전차로 어린 백성이 이르고저 할 바 있어도","이런 전차로 어린 백성이 니르고저 홀배 있어도"]},
  {g:"마참내 제 뜨들 시러 펴디 몯할 노미 하니라",
   v:["마참내 제 뜻을 실어 펴디 못할 노미 하니라","마침내 제 뜻을 실어 펴지 못할 놈이 하니라","마참내 제 뜨들 실어 펴디 못할 놈이 하니라"]},
  {g:"내 이랄 위하야 어엿비 너겨",
   v:["내 이를 위하여 어여삐 여겨","내 이랄 위하여 어엿비 너겨","내 이를 위하야 어엿비 너겨"]},
  {g:"새로 스믈여듧 자랄 맹가노니",
   v:["새로 스물여덟 자를 만드노니","새로 스물여덟 자랄 맹가노니","새로 스물여듧 자를 맹가노니",
      "새로 스물여덟 자를 맹가노니","새로 스물여덟 자라 맹가 노니","새로 스물여덟 잘 할 맹가노니",
      "새로 스물여덟 자를 망가노니","새로 스물여덟 자랑 맹가 놓니","새로 스물여덟 자를 만들었으니",
      "새로 스물여덟 자를 만드니","새로 스물여덟 자 맹가노니","새로 스물여덟 차를 맹가노니"]},
  {g:"사람마다 해여 수비 니겨",
   v:["사람마다 하여 쉬이 익혀","사람마다 해여 쉽게 익혀","사람마다 해여 수비 이겨"]},
  {g:"날로 쑤메 뼌한킈 하고져 할 따라미니라",
   v:["날로 씀에 편안케 하고자 할 따름이니라","날로 쓰메 편한키 하고져 할 따라미니라","날로 쑤메 편한 키 하고져 할 따름이니라"]}
];

const GOOD=0.55;   // 이 이상이면 '잘 들림'
const FOUND=0.45;  // 이 이상이면 그 줄을 읽은 것으로 보고 다음 줄을 찾으러 감
const STOP=0.6;    // 마지막 줄이 이만큼 들리면 시간을 멈춤

/* 한글 → 자모 (비교용). map: 자모 하나하나가 원래 글자의 몇 번째에서 왔는지 */
const CHO="ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
const JUNG="ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ";
const JONG=["","ㄱ","ㄲ","ㄱㅅ","ㄴ","ㄴㅈ","ㄴㅎ","ㄷ","ㄹ","ㄹㄱ","ㄹㅁ","ㄹㅂ","ㄹㅅ","ㄹㅌ","ㄹㅍ","ㄹㅎ","ㅁ","ㅂ","ㅂㅅ","ㅅ","ㅆ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
const SAME={"ㅔ":"ㅐ","ㅖ":"ㅒ","ㅙ":"ㅚ","ㅞ":"ㅚ"};
const fixNum=s=>s.replace(/28/g,"스물여덟").replace(/이십팔/g,"스물여덟");
function jamoMap(s){
  let j="",map=[];
  for(let k=0;k<s.length;k++){
    const c=s.charCodeAt(k);
    if(c>=0xAC00&&c<=0xD7A3){
      const i=c-0xAC00, cho=CHO[Math.floor(i/588)], jung=JUNG[Math.floor((i%588)/28)];
      const part=(cho!=="ㅇ"?cho:"")+(SAME[jung]||jung)+JONG[i%28]; // 소리 없는 ㅇ은 뺌
      j+=part; for(let q=0;q<part.length;q++) map.push(k);
    }
  }
  return {j,map};
}
const jamo=s=>jamoMap(fixNum(s)).j;

/* 근사 부분문자열 일치: 들린 말 어딘가에 목표 줄이 얼마나 비슷하게 들어 있는지 (0~1)와 그 위치 */
function bestMatch(p,t){
  const m=p.length,n=t.length;
  if(!m||!n) return {score:0,start:0,end:0};
  let prev=new Array(n+1).fill(0), ps=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){
    const cur=new Array(n+1), cs=new Array(n+1); cur[0]=i; cs[0]=0; const pc=p[i-1];
    for(let j=1;j<=n;j++){
      const a=prev[j]+1, b=cur[j-1]+1, c=prev[j-1]+(pc===t[j-1]?0:1);
      if(c<=a&&c<=b){cur[j]=c;cs[j]=ps[j-1]} else if(a<=b){cur[j]=a;cs[j]=ps[j]} else {cur[j]=b;cs[j]=cs[j-1]}
    }
    prev=cur; ps=cs;
  }
  let best=Infinity,end=0;
  for(let j=0;j<=n;j++) if(prev[j]<best){best=prev[j];end=j}
  return {score:Math.max(0,1-best/m),start:ps[end],end};
}
const TARGETS=LINES.map(l=>[l.g,...l.v].map(jamo));
const LENS=TARGETS.map(t=>t[0].length);

/* 들린 말 전체를 줄 순서대로 짚어 가며 줄마다 점수를 매김.
   어떤 줄이 안 들렸으면 그 자리에 머물러 다음 줄을 찾음 → 한 줄 놓쳐도 뒷줄은 정상 채점 */
function analyze(raw){
  const text=fixNum(raw), {j,map}=jamoMap(text);
  const out=[]; let pos=0;
  for(let i=0;i<LINES.length;i++){
    const win=j.slice(pos,pos+LENS[i]*3+40);
    let best={score:0,start:0,end:0};
    for(const p of TARGETS[i]){const m=bestMatch(p,win); if(m.score>best.score) best=m}
    let heard="";
    if(best.score>=FOUND && best.end>best.start){
      heard=text.slice(map[pos+best.start],map[pos+best.end-1]+1);
      pos+=best.end;
    }
    out.push({score:best.score,heard});
  }
  return out;
}
function lastLineHeard(raw){
  const J=jamo(raw);
  return Math.max(...TARGETS[LINES.length-1].map(p=>bestMatch(p,J).score))>=STOP;
}

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function drawText(){
  $("text").innerHTML=LINES.map((l,i)=>
    `<div class="ln" id="l${i}"><span class="no">${i+1}</span><span class="tx">${l.g}</span><span class="mk"></span></div>`).join("");
  fitText();
}
/* 8줄이 한 줄씩, 틀 안에 꼭 맞도록 가장 큰 글자 크기를 찾음 */
function fitText(){
  const box=$("text");
  const fits=()=>{
    if(box.scrollHeight>box.clientHeight+1) return false;
    for(const t of box.querySelectorAll(".tx")) if(t.scrollWidth>t.clientWidth+1) return false;
    return true;
  };
  let lo=12,hi=72;
  while(hi-lo>1){const mid=(lo+hi)>>1; box.style.fontSize=mid+"px"; if(fits()) lo=mid; else hi=mid}
  box.style.fontSize=lo+"px";
}
let rz; addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(fitText,120)});
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitText);

/* 음성 인식 */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){$("noSupport").classList.remove("hidden");$("startBtn").disabled=true}

let rec=null,listening=false,dropNext=false;
let committed="",sessionText="";
let t0=0,raf=0,timing=false,stopTime=0,countIv,finTo;

function startRec(){
  rec=new SR();
  rec.lang="ko-KR"; rec.continuous=true; rec.interimResults=true;
  sessionText="";
  rec.onresult=e=>{
    let s="";
    for(let i=0;i<e.results.length;i++) s+=e.results[i][0].transcript+" ";
    sessionText=s;
    onHeard();
  };
  rec.onerror=e=>{
    if(e.error==="not-allowed"||e.error==="service-not-allowed"){
      listening=false; $("mic").classList.remove("on");
      $("heard").innerHTML="<bdi>마이크가 막혀 있어요. 주소창 옆 자물쇠에서 마이크를 허용해 주세요.</bdi>";
    }
  };
  rec.onend=()=>{
    // 브라우저가 인식을 끊으면 들은 걸 보관하고 곧바로 다시 켬
    if(dropNext) dropNext=false; else committed+=sessionText;
    sessionText="";
    if(listening) try{startRec()}catch(e){setTimeout(()=>{if(listening) try{startRec()}catch(e){}},50)}
  };
  try{rec.start();$("mic").classList.add("on")}catch(e){}
}
function stopRec(){
  listening=false; $("mic").classList.remove("on");
  if(rec){rec.onend=null;try{rec.abort()}catch(e){}}
}
const allText=()=>committed+sessionText;

/* 읽는 동안: 들린 줄에 도장, 시간 멈춤은 마지막 줄이 들리는 순간 */
function onHeard(){
  if(!timing) return;
  const all=allText();
  const tail=all.trim().slice(-40);
  if(tail) $("heard").innerHTML=`<bdi>${esc(tail)}</bdi>`;
  const res=analyze(all);
  let last=-1;
  res.forEach((r,i)=>{
    const ln=$("l"+i);
    if(r.score>=GOOD){
      last=i;
      if(!ln.classList.contains("done")){ln.classList.add("done");ln.querySelector(".mk").innerHTML='<span class="stamp">통과</span>'}
    }
  });
  document.querySelectorAll(".ln.now").forEach(e=>e.classList.remove("now"));
  if(last+1<LINES.length) $("l"+(last+1)).classList.add("now");
  if(lastLineHeard(all)) stop();
}

function tick(){
  $("timer").innerHTML=`${((performance.now()-t0)/1000).toFixed(1)}<small>초</small>`;
  raf=requestAnimationFrame(tick);
}

function begin(){
  drawText(); committed=""; sessionText=""; timing=false;
  $("text").classList.add("reading");
  $("timer").innerHTML="0.0<small>초</small>";
  $("heard").innerHTML="<bdi>멈추지 말고 끝까지 읽어요</bdi>";
  $("ready").classList.add("hidden"); $("playing").classList.remove("hidden");
  fitText();
  listening=true; startRec();               // 버튼 누르는 순간 켜야 마이크 허용 창이 뜸
  let n=3; $("countNum").textContent=n; $("countOv").classList.remove("hidden");
  countIv=setInterval(()=>{
    n--;
    if(n>0){$("countNum").textContent=n;return}
    clearInterval(countIv); $("countOv").classList.add("hidden");
    committed=""; sessionText="";             // 카운트다운 동안 들린 소리는 버림
    dropNext=true; try{rec&&rec.abort()}catch(e){}
    $("l0").classList.add("now");
    t0=performance.now(); timing=true; tick();
  },900);
}

/* 시간 멈춤 → 인식기가 마지막 글자를 다듬을 때까지 잠깐 더 듣고 채점 */
function stop(){
  if(!timing) return;
  timing=false; stopTime=(performance.now()-t0)/1000;
  cancelAnimationFrame(raf);
  $("timer").innerHTML=`${stopTime.toFixed(1)}<small>초</small>`;
  $("waitOv").classList.remove("hidden");
  finTo=setTimeout(showResult,1300);
}
function showResult(){
  stopRec(); $("waitOv").classList.add("hidden");
  const res=analyze(allText());
  const total=LENS.reduce((a,b)=>a+b,0);
  const acc=Math.round(res.reduce((a,r,i)=>a+r.score*LENS[i],0)/total*100);
  $("rTime").innerHTML=`${stopTime.toFixed(1)}<small>초</small>`;
  $("rAcc").innerHTML=`${acc}<small>%</small>`;
  $("rRows").innerHTML=res.map((r,i)=>{
    const p=Math.round(r.score*100), low=r.score<GOOD;
    const h=r.heard?`들린 말: ${esc(r.heard)}`:"잘 안 들렸어요";
    return `<li class="${low?"low":""}"><span class="n">${i+1}</span><span class="g">${LINES[i].g}</span><span class="p">${p}%</span><span class="h">${h}</span></li>`;
  }).join("");
  $("endOv").classList.remove("hidden");
  $("nextBtn").focus();
}
function reset(){
  clearInterval(countIv); clearTimeout(finTo); timing=false; cancelAnimationFrame(raf); stopRec();
  ["countOv","waitOv","endOv","playing"].forEach(id=>$(id).classList.add("hidden"));
  $("ready").classList.remove("hidden");
  $("text").classList.remove("reading");
  $("timer").innerHTML="0.0<small>초</small>";
  drawText(); $("startBtn").focus();
}

$("startBtn").onclick=begin;
$("endBtn").onclick=stop;
$("nextBtn").onclick=reset;
$("resetBtn").onclick=reset;
drawText();
</script>
